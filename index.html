<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebeșul Aleargă - Platformă Antrenamente</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css"> <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-screen" class="container" style="margin-top: 50px;">
        <div class="card">
            <h2>Autentificare Membru</h2>
            <p>Introdu datele primite de la asociație.</p>
            <input type="text" id="username" placeholder="Utilizator" style="width: 80%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ddd;"><br>
            <input type="password" id="password" placeholder="Parolă" style="width: 80%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ddd;"><br>
            <button class="btn-main" onclick="checkLogin()">Intră în aplicație</button>
            <p id="error-msg" style="color: red; display: none; font-size: 0.8em; margin-top: 10px;">Date incorecte!</p>
        </div>
    </div>

    <div id="app-content" style="display: none;">
        <div class="header">
            <h1>Sebeșul Aleargă 🏃‍♂️</h1>
            <p id="welcome-user"></p>
            <button onclick="logout()" style="background: none; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-top: 10px;">Ieșire</button>
        </div>

        <div class="container">
            <div class="card">
                <h2>🏋️‍♂️ Planul tău personal</h2>
                <p>Bine ai revenit! Antrenamentul de azi te așteaptă.</p>
            </div>
        </div>
    </div>

    <script>
        // Tabel simplu de utilizatori (Doar pentru test!)
        const users = {
            "lica": "sebes2026",
            "coleg1": "alergare123",
            "membru": "start"
        };

        function checkLogin() {
            const user = document.getElementById('username').value.toLowerCase();
            const pass = document.getElementById('password').value;

            if (users[user] && users[user] === pass) {
                // Salvează starea de login în memoria telefonului (Local Storage)
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', user);
                showApp(user);
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function showApp(user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('welcome-user').innerText = "Salut, " + user.toUpperCase() + "!";
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            location.reload(); // Reîmcarcă pagina pentru a cere login din nou
        }

        // Verifică la deschidere dacă utilizatorul este deja logat
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                showApp(localStorage.getItem('currentUser'));
            }
        };
    </script>
</body>
</html>
